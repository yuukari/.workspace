
################
### MONITORS ###
################

monitor = DP-1, 1920x1080, 0x0, 1
monitor = HDMI-A-1, 1920x1080, 1920x0, 1
monitor = eDP-1, 1920x1080, 3840x0, 1

################
### PROGRAMS ###
################

$terminal = kitty
$menu = walker
$tuiFileManager = ~/.config/hypr/scripts/apps/file-manager.sh
$fileManager = nautilus
$taskManager = ~/.config/hypr/scripts/apps/task-manager.sh

$scriptUtilsMenu = kitty --class floating-terminal-utils-menu -o confirm_os_window_close=0 zsh -c ~/.config/hypr/scripts/utils/utils-menu.sh
$scriptDevMenu = kitty --class floating-terminal-dev-menu -o confirm_os_window_close=0 zsh -c ~/.config/hypr/scripts/dev/dev-menu.sh
$scriptSessionMenu = kitty -o confirm_os_window_close=0 zsh -c ~/.config/hypr/scripts/session-menu.sh
$scriptLogout = kitty -o confirm_os_window_close=0 zsh -c ~/.config/hypr/scripts/logout.sh

#################
### AUTOSTART ###
#################

exec-once = hyprpm reload -n
exec-once = hyprpaper
exec-once = hypridle
exec-once = waybar
exec-once = swayosd-server
exec-once = elephant
exec-once = walker --gapplication-service
exec-once = ~/.config/hypr/scripts/weather.sh init
exec-once = ~/.config/hypr/scripts/weather.sh &
exec-once = ~/.config/hypr/scripts/vdirsyncer.sh &

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE, 13
env = HYPRCURSOR_SIZE, 13

###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2

    col.active_border = rgba(ff6cbfff) rgba(9d055cff) 45deg
    col.inactive_border = rgba(662b4cff)

    resize_on_border = false
    allow_tearing = false

    layout = dwindle
}

plugin {
    split-monitor-workspaces {
        count = 10
        keep_focused = 0
        enable_notifications = 0
        enable_persistent_workspaces = 1
    }
}

decoration {
    rounding = 0
    rounding_power = 2

    active_opacity = 0.96
    inactive_opacity = 0.96

    shadow {
        enabled = false
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 4
        passes = 1

        vibrancy = 0.1696
    }
}

animations {
    enabled = yes, please :)

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}

dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 2
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us,ru
    kb_options = grp:alt_shift_toggle

    accel_profile = flat
    force_no_accel = 0
    follow_mouse = 0

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
    }
}

device {
    name = logitech-usb-optical-mouse
    sensitivity = -0.65
}

device {
    name = elan0524:00-04f3:3215-touchpad
    scroll_factor = 0.3
    sensitivity = 0.22
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

###################
### KEYBINDINGS ###
###################

# Quick launch for apps
bind = SUPER, T, exec, $terminal
bind = SUPER, E, exec, $tuiFileManager
bind = SUPER SHIFT, E, exec, $fileManager
bind = SUPER, SPACE, exec, $menu
bind = SUPER, O, exec, $taskManager

# Utilites
bind = , PRINT, exec, grimblast copy screen
bind = SUPER, PRINT, exec, grimblast copy area

# Session menu, lockscreen, etc
bind = SUPER, L, exec, hyprlock
bind = SUPER SHIFT, L, exec, [float; pin; stayfocused; size 500 230] $scriptLogout
bind = SUPER, ESCAPE, exec, [float; pin; stayfocused; size 410 285] $scriptSessionMenu
bind = SUPER, U, exec, $scriptUtilsMenu
bind = SUPER, K, exec, $scriptDevMenu

# Window controls
bind = SUPER, V, togglefloating,
bind = SUPER, P, pseudo,
bind = SUPER, J, togglesplit,
bind = SUPER, W, killactive,

bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

bind = SUPER SHIFT, left, swapwindow, l
bind = SUPER SHIFT, right, swapwindow, r
bind = SUPER SHIFT, up, swapwindow, u
bind = SUPER SHIFT, down, swapwindow, d

# Workspaces
bind = SUPER, 1, split-workspace, 1
bind = SUPER, 2, split-workspace, 2
bind = SUPER, 3, split-workspace, 3
bind = SUPER, 4, split-workspace, 4
bind = SUPER, 5, split-workspace, 5
bind = SUPER, 6, split-workspace, 6
bind = SUPER, 7, split-workspace, 7
bind = SUPER, 8, split-workspace, 8
bind = SUPER, 9, split-workspace, 9
bind = SUPER, 0, split-workspace, 10

bind = SUPER SHIFT, 1, split-movetoworkspace, 1
bind = SUPER SHIFT, 2, split-movetoworkspace, 2
bind = SUPER SHIFT, 3, split-movetoworkspace, 3
bind = SUPER SHIFT, 4, split-movetoworkspace, 4
bind = SUPER SHIFT, 5, split-movetoworkspace, 5
bind = SUPER SHIFT, 6, split-movetoworkspace, 6
bind = SUPER SHIFT, 7, split-movetoworkspace, 7
bind = SUPER SHIFT, 8, split-movetoworkspace, 8
bind = SUPER SHIFT, 9, split-movetoworkspace, 9
bind = SUPER SHIFT, 0, split-movetoworkspace, 10

bind = SUPER ALT, right, split-cycleworkspaces, next
bind = SUPER ALT, left, split-cycleworkspaces, prev

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, swayosd-client --output-volume +5
bindel = ,XF86AudioLowerVolume, exec, swayosd-client --output-volume -5
bindel = ,XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindel = ,XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle
bindel = ,XF86MonBrightnessUp, exec, swayosd-client --brightness +10
bindel = ,XF86MonBrightnessDown, exec, swayosd-client --brightness -10

##############################
### WINDOWS AND WORKSPACES ###
##############################

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

# Floating terminals from Waybar
windowrule = float,class:^(floating-terminal.*)$
windowrule = center,class:^(floating-terminal.*)$
windowrulev2 = stayfocused,class:^floating-terminal-(utils-menu|dev-menu|pritunl-vpn|bt-wifi|sound)$

windowrule = size 1186 800,class:^(floating-terminal-weather)$
windowrule = size 768 687,class:^(floating-terminal-calendar)$
windowrule = size 1186 890,class:^(floating-terminal-task-manager)$

windowrule = size 410 285,class:^(floating-terminal-utils-menu)$
windowrule = size 410 285,class:^(floating-terminal-dev-menu)$
windowrule = size 648 492,class:^(floating-terminal-pritunl-vpn)$

windowrule = size 616 798,class:^(floating-terminal-bt-wifi)$
windowrule = size 616 798,class:^(floating-terminal-sound)$
windowrule = size 828 602,class:^(floating-terminal-packages)$

# For JetBrains IDEs
windowrulev2 = tag +jb, class:^jetbrains-.+$,floating:1
windowrulev2 = stayfocused, tag:jb
windowrulev2 = noinitialfocus, tag:jb
windowrulev2 = noinitialfocus,class:^jetbrains-(?!toolbox),floating:1
